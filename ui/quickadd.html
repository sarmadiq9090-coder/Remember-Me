<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Remember Me • Quick add</title><link rel="stylesheet" href="styles/styles.css"><link rel="stylesheet" href="styles/quickadd.css"><link rel="stylesheet" href="styles/theme.css"></head><body class="quickadd-body">
