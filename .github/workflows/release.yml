name: Release

# Pushing a tag such as v1.4.1 builds the Windows installer, attests where it was built, and
# publishes it with SHA-256 checksums and the latest.yml and .blockmap files the app's updater
# reads. Running it by hand only builds the files and uploads them as workflow artifacts: it
# creates no release and no attestation.
#
# The build job runs the dependencies and build tools with a read-only token that isn't kept in
# the checkout. Only the publish job, which runs no repository code, can write releases and
# attestations.
#
# The build job also writes latest.json, the update manifest the Cloudflare mirror serves next to
# latest.yml (docs/specs/update-manifest.md). The publish job signs it (latest.json.minisig) when
# the release Environment has MINISIGN_SECRET_KEY, skips that with a warning otherwise, and attaches
# both to the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match package.json version $version" }
      - run: pnpm test
      - run: pnpm run package
      - run: pnpm run installer
      - name: Check the update files exist
        shell: pwsh
        working-directory: release/installer
        run: |
          $installer = Get-ChildItem -Filter 'Remember-Me-Setup-*.exe' | Select-Object -First 1
          foreach ($file in @('latest.yml', "$($installer.Name).blockmap")) { if (-not (Test-Path $file)) { throw "electron-builder did not write $file" } }
          if (-not (Select-String -Path latest.yml -SimpleMatch "path: $($installer.Name)" -Quiet)) { throw 'latest.yml does not point at the installer' }
      - name: Write SHA-256 checksums
        shell: pwsh
        working-directory: release/installer
        run: |
          # LF line endings so `sha256sum -c SHA256SUMS.txt` also works outside Windows.
          $lines = Get-ChildItem -Filter 'Remember-Me-Setup-*.exe' | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          Set-Content -Encoding ascii -NoNewline SHA256SUMS.txt -Value (($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt
      - name: Write the update manifest (latest.json)
        shell: bash
        working-directory: release/installer
        run: |
          installer=$(ls Remember-Me-Setup-*.exe)
          version=$(node -p "require('../../package.json').version")
          # --layout flat: the mirror is a generic electron-updater feed, the installer next to latest.yml.
          python ../../tools/make-update-manifest build --app remember-me --version "$version" \
            --repo "$GITHUB_REPOSITORY" --layout flat --notes-file "../../docs/release-notes/v$version.md" \
            --asset x64="$installer" --out latest.json
          python ../../tools/make-update-manifest verify latest.json --app remember-me --assets .
          # latest.json and latest.yml must name the same installer with the same SHA-512.
          node -e "const m=require('./latest.json').assets.x64, y=require('node:fs').readFileSync('latest.yml','utf8'); if (!y.includes('path: '+m.name) || !y.includes('sha512: '+m.sha512)) { console.error('latest.json and latest.yml disagree'); process.exit(1); }"
      # For winget, Scoop and Chocolatey submissions after the release; not uploaded to the release itself.
      - run: node tools/winget-manifest.mjs --sums release/installer/SHA256SUMS.txt --out release/winget
      - run: node tools/package-managers.mjs --sums release/installer/SHA256SUMS.txt --out release/package-managers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            release/installer/Remember-Me-Setup-*.exe
            release/installer/Remember-Me-Setup-*.exe.blockmap
            release/installer/latest.yml
            release/installer/latest.json
            release/installer/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: release/winget/*.yaml
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-managers
          path: release/package-managers/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # minisign 0.12, verified with its author's key RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3.
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      # No checkout: this job only handles the files the build job produced.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer
      - name: Check the checksums
        working-directory: installer
        run: sha256sum -c SHA256SUMS.txt
      # Sign only what this job checked itself: the manifest names this tag and the installer above.
      - name: Check the update manifest
        working-directory: installer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          installer=$(ls Remember-Me-Setup-*.exe)
          jq -e --arg tag "$TAG" --arg f "$installer" --arg h "$(sha256sum "$installer" | cut -d' ' -f1)" \
            '.schema == 1 and .app == "remember-me" and .tag == $tag and .assets.x64.name == $f and .assets.x64.sha256 == $h' latest.json
      - name: Is manifest signing set up?
        id: cfg
        env:
          HAS_SECRET: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          if [ "$HAS_SECRET" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::latest.json is NOT signed (no MINISIGN_SECRET_KEY in the release Environment): the app uses the update mirror only when GitHub's latest.yml names the same installer. docs/specs/update-manifest.md"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install minisign (pinned, checksum-verified)
        if: steps.cfg.outputs.signed == 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o minisign.tar.gz "$MINISIGN_URL"
          echo "${MINISIGN_SHA256}  minisign.tar.gz" | sha256sum -c -
          tar xzf minisign.tar.gz minisign-linux/x86_64/minisign
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"
      - name: Sign the update manifest
        if: steps.cfg.outputs.signed == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m installer/latest.json -t "remember-me update-manifest $TAG"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -R -s "$key" -p "$RUNNER_TEMP/from-secret.pub"
          comment=$(minisign -V -H -Q -m installer/latest.json -p "$RUNNER_TEMP/from-secret.pub")
          [ "$comment" = "remember-me update-manifest $TAG" ] || { echo "::error::latest.json: trusted comment '$comment'"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/Remember-Me-Setup-*.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          installer=$(ls installer/Remember-Me-Setup-*.exe)
          # latest.yml and the .blockmap must stay next to the installer: the app's updater reads them.
          # latest.json (+ .minisig when signed) is for the Cloudflare mirror.
          manifest=(installer/latest.json)
          if [ -f installer/latest.json.minisig ]; then manifest+=(installer/latest.json.minisig); fi
          gh release create "$TAG" "$installer" "$installer.blockmap" installer/latest.yml installer/SHA256SUMS.txt "${manifest[@]}" --title "ذكرني | Remember Me $TAG" --generate-notes --verify-tag
