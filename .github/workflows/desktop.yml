name: Desktop

# Packages the app and drives the real Windows build with Playwright (tests/desktop-smoke.cjs).
# It is a separate workflow so it can be made manual-only if it ever proves flaky.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
        env:
          WAQT_BUILD_FOLDER: ci
          # Playwright attaches through --inspect, which release builds turn off with a fuse.
          WAQT_DESKTOP_TEST_BUILD: '1'
      - name: Run the smoke test against the packaged app
        shell: pwsh
        run: |
          $env:WAQT_EXECUTABLE = (Get-ChildItem release/ci/*/*.exe | Select-Object -First 1).FullName
          node tests/desktop-smoke.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-screenshots
          path: screenshots/
          if-no-files-found: ignore

  # Installs a previous release from GitHub, gives it Arabic data, installs this build over it the way
  # users and the updater do, and checks the data, the language and the app (tests/upgrade-desktop.cjs).
  # The first entry is the latest release, the version users have now; the second, the one before it.
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        previous: [v1.6.2, v1.6.1]
    env:
      PREVIOUS: ${{ matrix.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the previous release and check its checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Remember-Me-Setup-$($env:PREVIOUS.TrimStart('v'))-x64.exe"
          gh release download $env:PREVIOUS --repo $env:GITHUB_REPOSITORY --pattern $name --pattern SHA256SUMS.txt --dir previous
          if ($LASTEXITCODE -ne 0) { throw "Could not download $name from $env:PREVIOUS" }
          $expected = (Select-String -Path previous/SHA256SUMS.txt -SimpleMatch $name).Line.Split(' ')[0]
          $actual = (Get-FileHash "previous/$name" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "$name does not match SHA256SUMS.txt" }
          "Previous release: $name $actual"
      - run: pnpm run package
        env:
          WAQT_BUILD_FOLDER: ci
          # The same installer as a release, but Playwright can attach to the app it installs.
          WAQT_DESKTOP_TEST_BUILD: '1'
      - run: pnpm run installer
        env:
          WAQT_BUILD_FOLDER: ci
      - name: Check the installer name and update files
        shell: pwsh
        working-directory: release/installer
        run: |
          $version = (Get-Content ../../package.json -Raw | ConvertFrom-Json).version
          $name = "Remember-Me-Setup-$version-x64.exe"
          foreach ($file in @($name, "$name.blockmap", 'latest.yml')) { if (-not (Test-Path $file)) { throw "$file is missing" } }
          if (-not (Select-String -Path latest.yml -SimpleMatch "path: $name" -Quiet)) { throw 'latest.yml does not point at the installer' }
      - name: Upgrade from the previous release
        shell: pwsh
        run: |
          $old = (Get-ChildItem previous/Remember-Me-Setup-*.exe | Select-Object -First 1).FullName
          $new = (Get-ChildItem release/installer/Remember-Me-Setup-*.exe | Select-Object -First 1).FullName
          node tests/upgrade-desktop.cjs $old $new
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upgrade-screenshots-${{ matrix.previous }}
          path: screenshots/
          if-no-files-found: ignore
