name: Desktop

# Packages the app and drives the real Windows build with Playwright (tests/desktop-smoke.cjs).
# It is a separate workflow so it can be made manual-only if it ever proves flaky.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
        env:
          WAQT_BUILD_FOLDER: ci
          # Playwright attaches through --inspect, which release builds turn off with a fuse.
          WAQT_DESKTOP_TEST_BUILD: '1'
      - name: Run the smoke test against the packaged app
        shell: pwsh
        run: |
          $env:WAQT_EXECUTABLE = (Get-ChildItem release/ci/*/*.exe | Select-Object -First 1).FullName
          node tests/desktop-smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-screenshots
          path: screenshots/
          if-no-files-found: ignore
